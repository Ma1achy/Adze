# Real run. GPT-2-small shaped denoiser.
name: v0

data:
  n_train: 200000
  n_val: 2000
  max_depth: 4
  operand_max: 100
  blocks_per_sequence: 8      # B — revisit against M1 length statistics
  seed: 0

model:
  latents_per_block: 4        # K
  latent_dim: 64              # D
  vae:
    n_layers: 6
    d_model: 512
    n_heads: 8
  denoiser:
    n_layers: 12
    d_model: 768
    n_heads: 12

train:
  batch_size: 64
  lr: 1.0e-4
  steps: 200000
  regime_b_prob: 0.1
  kl_beta: 1.0e-3

sample:
  nfe: 50

device: mps
