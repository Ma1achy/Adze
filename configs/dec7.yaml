# THE LENGTH CONTROL. Fixed 7-step chains, decorrelated dependency structure.
#
# WHY IT EXISTS. `dec10` changed two things at once against the old regime: chain
# length (3-7, mean 4.4 -> fixed 10) and dependency structure (post-order tree ->
# bounded-distance assignment). Repair collapsed to chance there while draft
# quality IMPROVED, and neither |S| nor the interior band nor loss explained it.
#
# This holds LENGTH constant at the old regime's maximum — B = 7, N = 28, exactly
# the old shape — and changes only the dependency structure. It separates "the
# decorrelated task is harder" from "10 steps is harder than 4".
#
#   works here, fails at dec10   -> length
#   fails at both                -> the decorrelated structure itself, which would
#                                   mean decorrelating and staying tractable are in
#                                   tension
#
# Verified swing 0.02pp over usable distances 1..3.
#
# THE SINGLE-INDEX BAND IS A SCOPE LIMIT, NOT A DEFECT. Every analysed step sits
# at position 2, so position is held PERFECTLY CONSTANT while distance varies —
# which is a cleaner design for isolating a distance effect than varying both and
# hoping they separate. What it cannot do is test position-dependence. State the
# result as "distance measured at fixed position; position-dependence untested"
# rather than as a weakness of the measurement.

name: dec7

data:
  n_train: 100
  n_val: 20
  generator: decorrelated
  chain_steps: 7              # matches the OLD regime's B exactly
  distance_max: 4             # usable distances 1..3
  max_depth: 3                # unused by the decorrelated builder; kept for schema
  operand_max: 20
  blocks_per_sequence: 7      # B — N = 28, identical to the old regime
  seed: 0
  # The fixed point is re-iterated against THIS generator's result distribution.
  # Carrying the tree generator's pool across would reintroduce the input/output
  # magnitude mismatch it exists to remove — 10 steps per trace and a different
  # operand mix give a different result distribution.
  leaf_distribution: empirical
  leaf_iterations: 6
  magnitude_cap: 100

model:
  latents_per_block: 4        # K
  latent_dim: 16              # D
  vae:
    n_layers: 4
    d_model: 128
    n_heads: 4
  denoiser:
    n_layers: 4
    d_model: 128
    n_heads: 4

train:
  batch_size: 8
  lr: 3.0e-4
  steps: 500
  regime_b_prob: 0.5
  kl_beta: 1.0e-3

sample:
  nfe: 8

device: mps
