# Fast-iteration config. Must overfit 8 examples to near-zero loss in under a minute.
# Keep this working at every milestone.
name: cap100

data:
  n_train: 100
  n_val: 20
  max_depth: 3
  operand_max: 20
  blocks_per_sequence: 7      # B — covers all depth-3 traces, drops nothing
  seed: 0
  # THE DATA FIX (session 12). Leaves were uniform on 1..operand_max while results
  # reach MAGNITUDE_CAP = 1000, so the model met small values as inputs and large
  # values only as outputs — a 6x truth cliff at magnitude ~30 against a decoder
  # that round-trips that range at 87%. Raising operand_max fixes it for no value;
  # the cap simply starts binding instead. "empirical" draws leaves from the fixed
  # point of the result distribution (converged at iteration 4, TV 0.0035).
  # `name` changed with it so the new artefacts do not overwrite the old ones.
  leaf_distribution: empirical
  leaf_iterations: 6
  # Cap 1000 made the fixed point converge onto THREE-digit arithmetic, which the
  # denoiser could not do at all: 0.8% truth against a 96.6% ceiling, flat in nfe
  # from 8 to 300. Cap 100 keeps the same self-consistency and lands two-digit.
  # Arithmetic difficulty is a nuisance variable here — the central experiment
  # tests global-vs-causal repair, not arithmetic ability — so it is set to where
  # the signal is measurable, deliberately.
  magnitude_cap: 100

model:
  latents_per_block: 4        # K
  latent_dim: 16              # D — best unseen-step reconstruction (M2 sweep)
  vae:
    n_layers: 4                # gate 1 needs 4; 2 plateaus at 94.7%
    d_model: 128
    n_heads: 4
  denoiser:
    n_layers: 2
    d_model: 128
    n_heads: 4

train:
  batch_size: 8
  lr: 3.0e-4
  steps: 500
  regime_b_prob: 0.1
  kl_beta: 1.0e-3

sample:
  nfe: 8                      # denoising steps

device: mps
