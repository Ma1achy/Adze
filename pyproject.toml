[project]
name = "adze"
version = "0.1.0"
description = "A latent diffusion reasoner"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: requires a trained model or long runtime"]
